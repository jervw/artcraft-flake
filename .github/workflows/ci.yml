name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix fmt -- --check .
      - run: nix flake check --no-build
      - id: apps
        run: |
          echo "apps=$(basename -s .json pkgs/sources/*.json | grep -vx craft-fonts \
            | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.eval.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Skip sources and vendored crates (~0.6-0.9 GiB per app); users only
          # need the built apps, and the free cache is 5 GB.
          pushFilter: "(-source|-vendor|-vendor-staging)$"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: nix build -L --no-link .#${{ matrix.app }}
